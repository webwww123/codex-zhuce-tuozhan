<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ChatGPT 自动注册</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <header class="header">
      <h1>ChatGPT 自动注册</h1>
      <p class="subtitle">侧边栏控制面板</p>
    </header>

    <section class="panel">
      <div class="status-row">
        <span id="status-dot" class="dot idle"></span>
        <span id="status-text">就绪</span>
      </div>
      <div id="step-text" class="step-text"></div>
      <div id="error-box" class="error-box" style="display: none;"></div>
      <div id="inbox-status" class="step-text" style="font-size:12px;color:#6b7280;"></div>
      <div class="field">
        <label for="generated-oauth-url">生成的 OAuth 地址</label>
        <input id="generated-oauth-url" type="text" readonly placeholder="这里会显示生成的 OAuth 地址">
      </div>
    </section>

    <section class="panel">
      <div class="field">
        <label for="email-provider">邮箱类型</label>
        <select id="email-provider">
          <option value="mailapi">Mailbox API</option>
          <option value="duckduckgo">DuckDuckGo</option>
        </select>
      </div>
      <div class="field">
        <label for="run-incognito">浏览器模式</label>
        <select id="run-incognito">
          <option value="true">无痕窗口</option>
          <option value="false">普通窗口</option>
        </select>
      </div>
      <div class="field">
        <label for="batch-count">注册数量</label>
        <input id="batch-count" type="number" min="1" max="200" step="1" value="1">
      </div>
      <div class="field">
        <label for="batch-delay-seconds">批量间隔(秒)</label>
        <input id="batch-delay-seconds" type="number" min="0" max="300" step="1" value="25">
      </div>
      <div class="field">
        <label for="code-timeout-seconds">收码超时(秒)</label>
        <input id="code-timeout-seconds" type="number" min="30" max="600" step="1" value="150">
      </div>

      <div class="field">
        <label for="cpa-url">CPA URL</label>
        <input id="cpa-url" type="text" placeholder="https://huangcli.zeabur.app">
      </div>
      <div class="field">
        <label for="cpa-key">CPA 密钥</label>
        <input id="cpa-key" type="password" placeholder="请输入 sk-...">
      </div>

      <div class="field">
        <label for="mail-api-url">Mailbox API URL</label>
        <input id="mail-api-url" type="text" placeholder="http://74.48.147.156:8787">
      </div>
      <div class="field">
        <label for="duck-forward-password">Mailbox API Key</label>
        <input id="duck-forward-password" type="password" placeholder="tm_admin_...">
      </div>
      <div class="field">
        <label for="mail-domain">Mailbox Domain (可选)</label>
        <input id="mail-domain" type="text" placeholder="mail.example.com 或 *.mail.example.com">
      </div>

      <div class="field">
        <label for="duck-forward-email">DuckDuckGo 转发邮箱</label>
        <input id="duck-forward-email" type="email" placeholder="your-mailbox@example.com">
      </div>

      <div class="actions single">
        <button id="save-config-btn" class="btn ghost">保存配置</button>
      </div>
    </section>

    <section class="panel actions">
      <button id="start-btn" class="btn primary">开始</button>
      <button id="pause-btn" class="btn ghost">暂停</button>
      <button id="reset-btn" class="btn ghost">重置</button>
    </section>

    <section id="profile-panel" class="panel" style="display: none;">
      <h2>当前资料</h2>
      <div class="info-line"><span>邮箱</span><strong id="profile-email">-</strong></div>
      <div class="info-line"><span>姓名</span><strong id="profile-name">-</strong></div>
      <div class="info-line"><span>密码</span><strong id="profile-password">-</strong></div>
    </section>
  </div>

  <script src="popup.js"></script>
</body>
</html>
